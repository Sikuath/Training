<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Incertitudes</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="incertitudes.css">

  <script>
    sessionStorage.setItem("lastExercise", window.location.href);
  </script>
</head>

<body class="page incertitudes-page">

  <nav class="topbar">
    <a class="home" href="index.html">🏠 Accueil</a>
    <a class="rappel" href="rappels.html">📘 Rappels</a>
  </nav>

   <!-- HUD -->
  <div class="hud">
    <div>⏱ Temps : <span id="timer">300s</span></div>
    <div>⭐ Score : <span id="score">0</span></div>
    <div>🎯 Mode : <span id="mode" style="color:#7CFC00; font-weight:bold;">easy</span></div>
    <div>🥇 Best : <span id="best">0</span></div>
    <div>👑 <span id="bestName">---</span></div>
  </div>

  <!-- Barre de progression -->
  <div class="progress-bar">
    <div id="progress"></div>
  </div>

  <!-- =========================
       LAYOUT 3 COLONNES
  ========================== -->

  <div class="layout">

    <!-- GAUCHE : IMAGE INSTRUMENT -->
  <div class="left-panel">

    <div id="domainLabel" class="domain-label">
  
    </div>

    <img id="instrumentImg" src="./images/incertitudes.png" alt="instrument">

    <div id="quantityLabel" class="quantity-label">
    
    </div>

  </div>
    <!-- CENTRE : MINI JEU -->
    <div class="center-panel">

      <h2>Incertitudes</h2>

      <p id="question">Clique sur Démarrer</p>

      <div id="choices"></div>

      <p id="feedback"></p>
      
      <div class="buttons">
        <button id="startBtn" onclick="startGame()">Démarrer</button>
        <button id="stopBtn" onclick="quitGame()" style="display:none;">Fin</button>
      </div>

    </div>

    <!-- DROITE : FEEDBACK -->
    <div class="right-panel">

      <img id="instrumentImg" src="./images/feedback.jpg" alt="Feedback">

      <div id="contextBox"></div>
      <div id="feedbackBox"></div>
    </div>

  </div>

  <audio id="goodSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
  <audio id="badLight" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

  <script src="inc_constante.js"></script>
  <script src="inc_feedback.js"></script>
  <script src="inc_typeA.js"></script>
  <script src="inc_typeB.js"></script>
  <script src="inc_typeC.js"></script>
  <script src="inc_typeD.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script type="module" src="incertitudes.js"></script>

</body>
</html>

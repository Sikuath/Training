<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GAME OVER</title>
<link rel="stylesheet" href="retro.css">
</head>

<body class="game-page">

<h1 class="glitch" id="title">GAME OVER</h1>

<div class="container">
  <p>SCORE : <span id="score">0</span></p>

  <input id="pseudo"
         maxlength="3"
         placeholder="AAA"
         autofocus
         autocomplete="off" />
  <br>

  <button id="okBtn">SAVE</button>
</div>

<script type="module">

import { addScore } from "./scoreService.js";

const params = new URLSearchParams(window.location.search);

const game = params.get("game") || "unknown";
const score = Number(params.get("score") || 0);

document.getElementById("score").textContent = score;

/* =========================
   TITRE DYNAMIQUE
========================= */

document.getElementById("title").textContent =
  game === "conversions"
    ? "CONVERSIONS - GAME OVER"
    : game === "significatifs"
      ? "SIGNIFICATIFS - GAME OVER"
      : game === "expressions"
        ? "EXPRESSIONS - GAME OVER"
        : game === "incertitudes"
          ? "INCERTITUDES - GAME OVER"
          : "GAME OVER";

/* =========================
   SAVE SCORE
========================= */

document.getElementById("okBtn").addEventListener("click", async () => {

    const name = document
        .getElementById("pseudo")
        .value
        .toUpperCase()
        .trim()
        .slice(0,3);

    if (!name)
        return;

    document.getElementById("okBtn").disabled = true;

    try {

        await addScore(game, name, score);

        window.location.href = "score.html";

    }
    catch(err){

        console.error(err);

        alert("Impossible d'enregistrer le score.");

        document.getElementById("okBtn").disabled = false;

    }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GAME OVER</title>
<link rel="stylesheet" href="retro.css">

<style>
  .hint {
    color: #00ff66;
    font-family: monospace;
    font-size: 14px;
    text-align: center;
    margin-top: 10px;
    letter-spacing: 1px;
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0.3; }
  }

  #pseudo {
    text-transform: uppercase;
    font-size: 20px;
    text-align: center;
    width: 120px;
    letter-spacing: 2px;
  }

  #okBtn {
    margin-top: 15px;
  }
</style>

</head>

<body class="game-page">

<h1 class="glitch" id="title">GAME OVER</h1>

<div class="container">

  <p>SCORE : <span id="score">0</span></p>

  <p class="hint">ENTER YOUR NAME</p>

  <input id="pseudo"
         maxlength="3"
         placeholder="AAA"
         autofocus
         autocomplete="off" />

  <br><br>

  <button id="okBtn">SAVE</button>

</div>

<script type="module">

import { addScore } from "./scoreService.js";

/* =========================
   PARAMS URL
========================= */

const params = new URLSearchParams(window.location.search);

const game = params.get("game") || "unknown";
const score = Number(params.get("score") || 0);

/* =========================
   SCORE DISPLAY
========================= */

document.getElementById("score").textContent = score;

/* =========================
   TITLE DYNAMIQUE
========================= */

const titles = {
  conversions: "CONVERSIONS - GAME OVER",
  significatifs: "SIGNIFICATIFS - GAME OVER",
  expressions: "EXPRESSIONS - GAME OVER",
  incertitudes: "INCERTITUDES - GAME OVER"
};

document.getElementById("title").textContent =
  titles[game] || "GAME OVER";

/* =========================
   SAVE SCORE
========================= */

document.getElementById("okBtn").addEventListener("click", async () => {

  let name = document
    .getElementById("pseudo")
    .value
    .trim()
    .toUpperCase()
    .slice(0, 3);

  if (!name) name = "AAA";

  name = name.replace(/[^A-Z]/g, "X");

  document.getElementById("okBtn").disabled = true;

  try {

    await addScore(game, name, score);

    window.location.href = "score.html";

  } catch (err) {

    console.error(err);

    alert("SAVE ERROR");

    document.getElementById("okBtn").disabled = false;
  }

});

</script>

</body>
</html>

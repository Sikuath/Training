<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>GAME OVER</title>
<link rel="stylesheet" href="retro.css">
</head>

<body class="game-page">

<h1 class="glitch" id="title">GAME OVER</h1>

<div class="container">
  <p>SCORE : <span id="score">0</span></p>

  <input id="pseudo"
         maxlength="10"
         placeholder="Ton nom"
         autofocus
         autocomplete="off" />

  <br><br>

  <button id="okBtn">SAVE</button>
</div>

<script type="module">

import { addScore } from "./scoreService.js";

/* =========================
   PARAMS URL
========================= */

const params = new URLSearchParams(window.location.search);

const game = params.get("game") || "unknown";
const score = Number(params.get("score") || 0);

/* =========================
   UI SCORE
========================= */

document.getElementById("score").textContent = score;

/* =========================
   TITRE DYNAMIQUE
========================= */

const titles = {
  conversions: "CONVERSIONS - GAME OVER",
  significatifs: "SIGNIFICATIFS - GAME OVER",
  expressions: "EXPRESSIONS - GAME OVER",
  incertitudes: "INCERTITUDES - GAME OVER"
};

document.getElementById("title").textContent =
  titles[game] || "GAME OVER";

/* =========================
   SAVE SCORE
========================= */

document.getElementById("okBtn").addEventListener("click", async () => {

  const name = document
    .getElementById("pseudo")
    .value
    .trim()
    .toUpperCase()
    .slice(0, 10);

  if (!name) {
    alert("Entre un nom !");
    return;
  }

  document.getElementById("okBtn").disabled = true;

  try {

    await addScore(game, name, score);

    window.location.href = "score.html";

  } catch (err) {

    console.error(err);

    alert("Erreur enregistrement score");

    document.getElementById("okBtn").disabled = false;
  }

});

</script>

</body>
</html>
